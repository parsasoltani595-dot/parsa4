<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- پس‌زمینه سفید با گوشه‌های گرد -->
    <rect width="512" height="512" fill="#ffffff" rx="100"/>
    
    <!-- حاشیه فیروزه‌ای -->
    <rect x="15" y="15" width="482" height="482" fill="none" stroke="#16a085" stroke-width="12" rx="85"/>
    
    <!-- طرح مرکزی (شبیه‌سازی لوگوی کتاب) -->
    <g fill="#16a085">
        <!-- المان مرکزی -->
        <path d="M256 180 C280 230 280 280 256 330 C232 280 232 230 256 180 Z"/>
        <circle cx="256" cy="255" r="12" fill="#ffffff"/>
        
        <!-- بال چپ -->
        <path d="M256 220 C210 220 170 250 160 300 C150 350 200 370 230 330 C210 340 180 320 190 290 C200 260 220 240 256 240 Z"/>
        <!-- بال راست -->
        <path d="M256 220 C302 220 342 250 352 300 C362 350 312 370 282 330 C302 340 332 320 322 290 C312 260 292 240 256 240 Z"/>
        
        <!-- شاخک‌های بالا -->
        <path d="M256 180 C240 150 200 140 180 160 C160 180 180 210 210 210 C200 200 210 170 230 170 C240 170 250 180 256 200 Z"/>
        <path d="M256 180 C272 150 312 140 332 160 C352 180 332 210 302 210 C312 200 302 170 282 170 C272 170 262 180 256 200 Z"/>
        
        <!-- پایه -->
        <path d="M220 340 L292 340 L280 370 L232 370 Z"/>
    </g>

    <!-- متن‌ها -->
    <!-- "علوم تجربی" -->
    <text x="256" y="140" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="56" font-weight="bold" fill="#880e4f" text-anchor="middle">علوم تجربی</text>
    
    <!-- "ششم دبستان" -->
    <text x="256" y="440" font-family="'Vazirmatn', Tahoma, sans-serif" font-size="44" font-weight="bold" fill="#00897b" text-anchor="middle">ششم دبستان</text>
    
    <!-- خط تزئینی زیر متن -->
    <path d="M150 410 L362 410" stroke="#880e4f" stroke-width="4" stroke-linecap="round"/>
</svg>